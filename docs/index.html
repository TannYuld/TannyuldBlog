<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Amazing Blog</title>
<style>
  body {
    background-color: #0d0d0d;
    color: #cccccc;
    font-family: "Courier New", Courier, monospace;
    margin: 40px auto;
    max-width: 700px;
    padding: 0 20px;
    line-height: 1.5;
  }

  .site-header {
    border-bottom: 2px solid #333333;
    padding-bottom: 10px;
    margin-bottom: 30px;
    overflow: hidden;
  }

  .site-name {
    float: left;
    font-weight: bold;
    color: #e0a030;
  }

  .site-nav {
    float: right;
  }

  .site-nav a {
    margin-left: 12px;
    color: #e0a030;
    text-decoration: none;
  }

  .site-nav a:hover {
    text-decoration: underline;
  }

  h1 {
    font-size: 30px;
    margin-bottom: 0;
    color: #f0f0f0;
  }

  h2.subtitle {
    font-size: 15px;
    font-weight: normal;
    color: #999999;
    margin-top: 6px;
    margin-bottom: 20px;
  }

  hr {
    border: none;
    border-top: 1px solid #333333;
    margin-bottom: 20px;
  }

  .post {
    display: block;
    padding: 14px 0;
    border-bottom: 1px solid #262626;
    text-decoration: none;
    color: #cccccc;
  }

  .post:hover {
    background-color: #161616;
  }

  .post-date {
    font-size: 12px;
    color: #777777;
  }

  .post-title {
    font-size: 18px;
    font-weight: bold;
    color: #e0a030;
    text-decoration: underline;
    margin: 4px 0;
  }

  .post-tags {
    font-size: 12px;
    color: #777777;
    margin-bottom: 8px;
  }

  .post-preview {
    font-size: 14px;
    margin: 0 0 6px 0;
  }

  .read-more {
    font-size: 12px;
    color: #999999;
  }
</style>
</head>
<body>

<div class="site-header">
  <span class="site-name">MY AMAZING BLOG</span>
  <span class="site-nav">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="#">RSS</a>
  </span>
</div>


<h1>My Amazing Blog</h1>
<h2 class="subtitle">Blogposts</h2>

<hr>

<script src="./index.js" type="module"></script>
</body>
</html>
